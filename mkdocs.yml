# mkdocs.yml
# Documentation configuration for the MS Data Analytics capstone project

site_name: AI-Driven Delivery Risk Prediction
site_description: Explainable machine learning and decision support for cross-border e-commerce supply chains
site_author: Kiruthikaa Natarajan Srinivasan

site_url: https://kiruthikaa2512.github.io/cb_supply_risk/
repo_url: https://github.com/Kiruthikaa2512/cb_supply_risk
repo_name: Kiruthikaa2512/cb_supply_risk

docs_dir: docs
site_dir: site

theme:
  name: mkdocs

plugins:
  - search

markdown_extensions:
  - admonition
  - codehilite
  - tables
  - toc:
      permalink: true
      toc_depth: 3

nav:
  - Home: index.md
  - Project Overview: project-overview.md
  - Data Cleaning: data-cleaning.md
  - Exploratory Data Analysis: exploratory-data-analysis.md
  - Predictive Modeling: predictive-modeling.md
  - Results and Interpretation: results-interpretation.md
  - Dashboard: dashboard.md
  - Conclusions: conclusions.md