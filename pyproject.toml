# pyproject.toml
# Project configuration for the MS Data Analytics capstone

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cb-supply-risk"
version = "1.0.0"
description = "AI-driven delivery risk prediction and explainable decision support for cross-border e-commerce supply chains"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

authors = [
  { name = "Kiruthikaa Natarajan Srinivasan" }
]

classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

dependencies = [
  "ipykernel",
  "joblib",
  "matplotlib",
  "numpy",
  "pandas",
  "scikit-learn",
  "seaborn",
  "shap",
  "shiny",
]

[project.urls]
Homepage = "https://github.com/Kiruthikaa2512/cb_supply_risk"
Repository = "https://github.com/Kiruthikaa2512/cb_supply_risk"
Documentation = "https://kiruthikaa2512.github.io/cb_supply_risk/"
Issues = "https://github.com/Kiruthikaa2512/cb_supply_risk/issues"

[project.optional-dependencies]
docs = [
  "mkdocs",
]

dev = [
  "pytest",
  "ruff",
]

[tool.setuptools]
packages = []

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
  ".venv",
  "site",
  "build",
  "dist",
  "__pycache__",
  ".ipynb_checkpoints",
]

[tool.ruff.format]
quote-style = "preserve"
line-ending = "lf"

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "W",
]
ignore = [
  "E501",
]

[tool.ruff.lint.per-file-ignores]
"notebooks/**/*.ipynb" = ["F821"]